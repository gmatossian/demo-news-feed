<div class="demo-banner">
  <p class="demo-banner__text">
    <strong>Demo app</strong> for learning and practice · fictional authors and posts · no sign-in
  </p>
  <button type="button" class="demo-banner__reset" (click)="dialog.open()">Reset demo data</button>
</div>

<app-confirm-dialog
  #dialog
  heading="Reset demo data?"
  confirmLabel="Reset demo data"
  [busy]="resetting()"
  [error]="error()"
  (confirmed)="reset(dialog)"
  (closed)="error.set(null)"
>
  <p>
    This removes all current posts, including any you have written or edited, and restores the
    original fictional posts and authors.
  </p>
  <p>Only the app's local data changes. Source code and exercise work are not affected.</p>
</app-confirm-dialog>
