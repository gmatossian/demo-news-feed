spring.application.name=newsfeed
server.port=8081

# Local file-backed H2 database. The path is relative to the directory the backend
# is started from (backend/), so the default location is backend/data/.
# Override with NEWSFEED_DATA_DIR to keep data elsewhere.
spring.datasource.url=jdbc:h2:file:${NEWSFEED_DATA_DIR:./data}/newsfeed

# schema.sql runs on every start; it only creates missing tables and never touches data.
# Seeding a fresh database is handled by demodata.DemoDataConfig.
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Reject unexpected JSON fields (for example an author or publication time sent with an edit).
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.mvc.problemdetails.enabled=true
